<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0f"/>
      <stop offset="100%" style="stop-color:#111115"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41"/>
      <stop offset="100%" style="stop-color:#00cc88"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#326CE5"/>
      <stop offset="100%" style="stop-color:#00aaff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.8" fill="white" opacity="0.08"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dots)"/>

  <!-- Background glow -->
  <circle cx="400" cy="260" r="180" fill="#326CE5" opacity="0.04" filter="url(#softglow)"/>

  <!-- Kubernetes Helm wheel -->
  <g transform="translate(400, 250)">
    <!-- Outer hexagon -->
    <polygon points="0,-130 113,-65 113,65 0,130 -113,65 -113,-65"
             fill="none" stroke="url(#blue)" stroke-width="2" opacity="0.6"/>
    <polygon points="0,-100 87,-50 87,50 0,100 -87,50 -87,-50"
             fill="#326CE5" fill-opacity="0.06" stroke="url(#blue)" stroke-width="1.5" opacity="0.8"/>

    <!-- Spokes -->
    <g stroke="#326CE5" stroke-width="2" opacity="0.7">
      <line x1="0" y1="-50" x2="0" y2="-95"/>
      <line x1="43" y1="-25" x2="82" y2="-47"/>
      <line x1="43" y1="25" x2="82" y2="47"/>
      <line x1="0" y1="50" x2="0" y2="95"/>
      <line x1="-43" y1="25" x2="-82" y2="47"/>
      <line x1="-43" y1="-25" x2="-82" y2="-47"/>
    </g>

    <!-- Inner ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#326CE5" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="20" fill="#326CE5" fill-opacity="0.15" stroke="#326CE5" stroke-width="2"/>

    <!-- Nodes -->
    <g>
      <circle cx="0" cy="-105" r="10" fill="#111115" stroke="#326CE5" stroke-width="2"/>
      <circle cx="0" cy="-105" r="4" fill="#326CE5"/>
      <circle cx="91" cy="-53" r="10" fill="#111115" stroke="#326CE5" stroke-width="2"/>
      <circle cx="91" cy="-53" r="4" fill="#326CE5"/>
      <circle cx="91" cy="53" r="10" fill="#111115" stroke="#326CE5" stroke-width="2"/>
      <circle cx="91" cy="53" r="4" fill="#326CE5"/>
      <circle cx="0" cy="105" r="10" fill="#111115" stroke="#326CE5" stroke-width="2"/>
      <circle cx="0" cy="105" r="4" fill="#326CE5"/>
      <circle cx="-91" cy="53" r="10" fill="#111115" stroke="#326CE5" stroke-width="2"/>
      <circle cx="-91" cy="53" r="4" fill="#326CE5"/>
      <circle cx="-91" cy="-53" r="10" fill="#111115" stroke="#326CE5" stroke-width="2"/>
      <circle cx="-91" cy="-53" r="4" fill="#326CE5"/>
    </g>
  </g>

  <!-- Pod cards -->
  <g>
    <!-- Pod 1 -->
    <rect x="70" y="120" width="100" height="50" rx="10" fill="#111115" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="95" cy="145" r="6" fill="#00ff41" opacity="0.8"/>
    <text x="110" y="149" fill="white" opacity="0.6" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Pod 1</text>

    <!-- Pod 2 -->
    <rect x="630" y="120" width="100" height="50" rx="10" fill="#111115" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="655" cy="145" r="6" fill="#00ff41" opacity="0.8"/>
    <text x="670" y="149" fill="white" opacity="0.6" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Pod 2</text>

    <!-- Pod 3 -->
    <rect x="70" y="370" width="100" height="50" rx="10" fill="#111115" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="95" cy="395" r="6" fill="#00ff41" opacity="0.8"/>
    <text x="110" y="399" fill="white" opacity="0.6" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Pod 3</text>

    <!-- Pod 4 -->
    <rect x="630" y="370" width="100" height="50" rx="10" fill="#111115" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="655" cy="395" r="6" fill="#00ff41" opacity="0.8"/>
    <text x="670" y="399" fill="white" opacity="0.6" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Pod 4</text>
  </g>

  <!-- Connection lines -->
  <g stroke="white" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4,6">
    <line x1="170" y1="145" x2="290" y2="210"/>
    <line x1="170" y1="395" x2="290" y2="320"/>
    <line x1="630" y1="145" x2="510" y2="210"/>
    <line x1="630" y1="395" x2="510" y2="320"/>
  </g>

  <!-- Title -->
  <text x="400" y="505" fill="white" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="3">
    KUBERNETES MIGRATION
  </text>
  <text x="400" y="535" fill="white" opacity="0.35" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" letter-spacing="1">
    Cloud Native Transformation
  </text>
</svg>
