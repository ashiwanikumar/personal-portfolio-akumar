<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0f"/>
      <stop offset="100%" style="stop-color:#111115"/>
    </linearGradient>
    <linearGradient id="aws" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900"/>
      <stop offset="100%" style="stop-color:#FFB84D"/>
    </linearGradient>
    <linearGradient id="tf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B42BC"/>
      <stop offset="100%" style="stop-color:#9B6DD7"/>
    </linearGradient>
    <filter id="sg3">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>
  <pattern id="d3" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.8" fill="white" opacity="0.08"/>
  </pattern>
  <rect width="800" height="600" fill="url(#d3)"/>

  <!-- Background glow -->
  <circle cx="400" cy="220" r="150" fill="#FF9900" opacity="0.03" filter="url(#sg3)"/>

  <!-- AWS Cloud shape -->
  <g transform="translate(400, 180)">
    <!-- Cloud outline -->
    <path d="M-80,20 C-80,20 -90,-10 -60,-25 C-45,-50 0,-55 20,-35 C35,-55 75,-45 80,-20 C100,-15 100,10 85,20 Z"
          fill="#FF9900" fill-opacity="0.06" stroke="#FF9900" stroke-width="2" opacity="0.5"/>
    <text x="0" y="5" fill="#FF9900" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" font-weight="700" opacity="0.7">AWS</text>
  </g>

  <!-- Terraform code blocks -->
  <g transform="translate(160, 120)" opacity="0.35">
    <text fill="white" font-family="monospace" font-size="10" opacity="0.5">
      <tspan x="0" y="0">resource "aws_vpc" "main" {</tspan>
      <tspan x="0" y="16">  cidr_block = "10.0.0.0/16"</tspan>
      <tspan x="0" y="32">}</tspan>
    </text>
  </g>
  <g transform="translate(520, 120)" opacity="0.35">
    <text fill="white" font-family="monospace" font-size="10" opacity="0.5">
      <tspan x="0" y="0">module "eks" {</tspan>
      <tspan x="0" y="16">  source = "./modules"</tspan>
      <tspan x="0" y="32">}</tspan>
    </text>
  </g>

  <!-- Connection lines from cloud to services -->
  <g stroke="white" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="4,6">
    <line x1="300" y1="210" x2="180" y2="340"/>
    <line x1="370" y1="220" x2="310" y2="340"/>
    <line x1="430" y1="220" x2="440" y2="340"/>
    <line x1="500" y1="210" x2="570" y2="340"/>
    <line x1="400" y1="225" x2="700" y2="340"/>
  </g>

  <!-- AWS Services -->
  <g transform="translate(0, 340)">
    <!-- VPC -->
    <g transform="translate(140, 0)">
      <rect x="-40" y="0" width="80" height="65" rx="12" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <rect x="-12" y="14" width="24" height="18" rx="4" fill="none" stroke="#FF9900" stroke-width="1.5" opacity="0.5"/>
      <line x1="-8" y1="23" x2="8" y2="23" stroke="#FF9900" stroke-width="1" opacity="0.3"/>
      <text x="0" y="52" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">VPC</text>
    </g>

    <!-- EC2 -->
    <g transform="translate(280, 0)">
      <rect x="-40" y="0" width="80" height="65" rx="12" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <rect x="-10" y="14" width="20" height="16" rx="3" fill="none" stroke="#FF9900" stroke-width="1.5" opacity="0.5"/>
      <circle cx="0" cy="22" r="3" fill="#FF9900" opacity="0.3"/>
      <text x="0" y="52" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">EC2</text>
    </g>

    <!-- EKS -->
    <g transform="translate(420, 0)">
      <rect x="-40" y="0" width="80" height="65" rx="12" fill="#141416" stroke="#326CE5" stroke-opacity="0.2"/>
      <polygon points="0,12 10,18 10,28 0,34 -10,28 -10,18" fill="none" stroke="#326CE5" stroke-width="1.5" opacity="0.5"/>
      <circle cx="0" cy="23" r="3" fill="#326CE5" opacity="0.4"/>
      <text x="0" y="52" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">EKS</text>
    </g>

    <!-- RDS -->
    <g transform="translate(560, 0)">
      <rect x="-40" y="0" width="80" height="65" rx="12" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <ellipse cx="0" cy="20" rx="12" ry="5" fill="none" stroke="#FF9900" stroke-width="1.5" opacity="0.5"/>
      <line x1="-12" y1="20" x2="-12" y2="28" stroke="#FF9900" stroke-width="1.5" opacity="0.4"/>
      <line x1="12" y1="20" x2="12" y2="28" stroke="#FF9900" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="0" cy="28" rx="12" ry="5" fill="none" stroke="#FF9900" stroke-width="1.5" opacity="0.3"/>
      <text x="0" y="52" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">RDS</text>
    </g>

    <!-- S3 -->
    <g transform="translate(700, 0)">
      <rect x="-40" y="0" width="80" height="65" rx="12" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <rect x="-10" y="14" width="20" height="16" rx="2" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
      <path d="M-6,18 L6,18" stroke="#10b981" stroke-width="1" opacity="0.3"/>
      <path d="M-6,24" stroke="#10b981" stroke-width="1" opacity="0.3"/>
      <text x="0" y="52" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">S3</text>
    </g>
  </g>

  <!-- Title -->
  <text x="400" y="500" fill="white" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="3">
    AWS INFRASTRUCTURE
  </text>
  <text x="400" y="528" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" letter-spacing="1">
    Terraform Infrastructure as Code
  </text>
</svg>
