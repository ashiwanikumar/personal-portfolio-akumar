<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001100"/>
      <stop offset="100%" style="stop-color:#002200"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad3)"/>

  <!-- Grid pattern -->
  <g stroke="#00ff41" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- Cloud shape -->
  <g transform="translate(400, 180)" filter="url(#glow3)">
    <path d="M-120,30
             C-150,30 -160,0 -140,-20
             C-140,-50 -100,-70 -60,-60
             C-40,-90 20,-90 50,-70
             C90,-80 140,-50 140,-20
             C170,0 160,30 130,30 Z"
          fill="none" stroke="#00ff41" stroke-width="3"/>
    <text x="0" y="10" fill="#00ff41" font-family="monospace" font-size="20" text-anchor="middle">AWS</text>
  </g>

  <!-- Terraform blocks -->
  <g filter="url(#glow3)">
    <!-- VPC Block -->
    <g transform="translate(150, 320)">
      <rect x="-50" y="-30" width="100" height="60" rx="5" fill="none" stroke="#00ff41" stroke-width="2"/>
      <rect x="-45" y="-25" width="35" height="20" fill="#00ff41" fill-opacity="0.3"/>
      <rect x="5" y="-25" width="35" height="20" fill="#00ff41" fill-opacity="0.3"/>
      <text x="0" y="15" fill="#00ff41" font-family="monospace" font-size="11" text-anchor="middle">VPC</text>
    </g>

    <!-- EC2 Block -->
    <g transform="translate(300, 320)">
      <rect x="-50" y="-30" width="100" height="60" rx="5" fill="none" stroke="#00ff41" stroke-width="2"/>
      <rect x="-30" y="-20" width="60" height="25" fill="none" stroke="#00ff41" stroke-width="1"/>
      <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#00ff41" stroke-width="1"/>
      <line x1="-25" y1="-3" x2="15" y2="-3" stroke="#00ff41" stroke-width="1"/>
      <text x="0" y="15" fill="#00ff41" font-family="monospace" font-size="11" text-anchor="middle">EC2</text>
    </g>

    <!-- RDS Block -->
    <g transform="translate(450, 320)">
      <rect x="-50" y="-30" width="100" height="60" rx="5" fill="none" stroke="#00ff41" stroke-width="2"/>
      <ellipse cx="0" cy="-15" rx="25" ry="8" fill="none" stroke="#00ff41" stroke-width="1"/>
      <path d="M-25,-15 L-25,0 C-25,5 25,5 25,0 L25,-15" fill="none" stroke="#00ff41" stroke-width="1"/>
      <text x="0" y="15" fill="#00ff41" font-family="monospace" font-size="11" text-anchor="middle">RDS</text>
    </g>

    <!-- S3 Block -->
    <g transform="translate(600, 320)">
      <rect x="-50" y="-30" width="100" height="60" rx="5" fill="none" stroke="#00ff41" stroke-width="2"/>
      <path d="M-20,-20 L20,-20 L25,-5 L-25,-5 Z" fill="none" stroke="#00ff41" stroke-width="1"/>
      <ellipse cx="0" cy="-5" rx="25" ry="5" fill="none" stroke="#00ff41" stroke-width="1"/>
      <text x="0" y="15" fill="#00ff41" font-family="monospace" font-size="11" text-anchor="middle">S3</text>
    </g>
  </g>

  <!-- Connection lines from cloud to services -->
  <g stroke="#00ff41" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="5,5">
    <line x1="300" y1="210" x2="150" y2="285"/>
    <line x1="350" y1="210" x2="300" y2="285"/>
    <line x1="450" y1="210" x2="450" y2="285"/>
    <line x1="500" y1="210" x2="600" y2="285"/>
  </g>

  <!-- Terraform logo representation -->
  <g transform="translate(400, 450)" filter="url(#glow3)">
    <g transform="scale(0.8)">
      <!-- T shape blocks -->
      <polygon points="-60,-40 -20,-40 -20,0 -60,0" fill="#00ff41" fill-opacity="0.4" stroke="#00ff41" stroke-width="2"/>
      <polygon points="-15,-40 25,-40 25,0 -15,0" fill="#00ff41" fill-opacity="0.6" stroke="#00ff41" stroke-width="2"/>
      <polygon points="-15,5 25,5 25,45 -15,45" fill="#00ff41" fill-opacity="0.4" stroke="#00ff41" stroke-width="2"/>
      <polygon points="30,-40 70,-40 70,0 30,0" fill="#00ff41" fill-opacity="0.4" stroke="#00ff41" stroke-width="2"/>
    </g>
  </g>

  <!-- Code snippet decoration -->
  <g transform="translate(100, 100)" filter="url(#glow3)">
    <text fill="#00cc33" font-family="monospace" font-size="11">
      <tspan x="0" y="0">resource "aws_vpc" "main" {</tspan>
      <tspan x="0" y="15">  cidr_block = "10.0.0.0/16"</tspan>
      <tspan x="0" y="30">}</tspan>
    </text>
  </g>

  <g transform="translate(550, 100)" filter="url(#glow3)">
    <text fill="#00cc33" font-family="monospace" font-size="11">
      <tspan x="0" y="0">module "eks" {</tspan>
      <tspan x="0" y="15">  source = "./modules"</tspan>
      <tspan x="0" y="30">}</tspan>
    </text>
  </g>

  <!-- Title -->
  <text x="400" y="530" fill="#00ff41" font-family="monospace" font-size="24" text-anchor="middle" filter="url(#glow3)">
    AWS INFRASTRUCTURE
  </text>
  <text x="400" y="560" fill="#00cc33" font-family="monospace" font-size="14" text-anchor="middle">
    Terraform Infrastructure as Code
  </text>

  <!-- Decorative corners -->
  <g stroke="#00ff41" stroke-width="2" fill="none">
    <path d="M20,50 L20,20 L50,20"/>
    <path d="M750,20 L780,20 L780,50"/>
    <path d="M780,550 L780,580 L750,580"/>
    <path d="M50,580 L20,580 L20,550"/>
  </g>
</svg>
