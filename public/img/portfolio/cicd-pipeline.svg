<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0f"/>
      <stop offset="100%" style="stop-color:#111115"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="sg2">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>
  <pattern id="d2" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.8" fill="white" opacity="0.08"/>
  </pattern>
  <rect width="800" height="600" fill="url(#d2)"/>
  <ellipse cx="400" cy="220" rx="250" ry="100" fill="#10b981" opacity="0.03" filter="url(#sg2)"/>

  <!-- Infinity symbol -->
  <g transform="translate(400, 170)">
    <path d="M-80,0 C-80,-50 -25,-50 0,-25 C25,-50 80,-50 80,0 C80,50 25,50 0,25 C-25,50 -80,50 -80,0 Z"
          fill="none" stroke="url(#acc2)" stroke-width="2.5" opacity="0.4"/>
  </g>

  <!-- Pipeline stages -->
  <g transform="translate(0, 280)">
    <line x1="95" y1="35" x2="705" y2="35" stroke="white" stroke-opacity="0.05" stroke-width="1"/>

    <g transform="translate(115, 0)">
      <rect x="-40" y="0" width="80" height="70" rx="12" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <text x="0" y="33" fill="white" opacity="0.45" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle">&lt;/&gt;</text>
      <text x="0" y="57" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">CODE</text>
    </g>
    <path d="M160,35 L190,35" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <polygon points="190,32 196,35 190,38" fill="#10b981" opacity="0.3"/>

    <g transform="translate(235, 0)">
      <rect x="-40" y="0" width="80" height="70" rx="12" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <rect x="-10" y="18" width="20" height="14" rx="3" fill="none" stroke="white" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="-6" y="27" width="12" height="7" rx="1.5" fill="white" opacity="0.12"/>
      <text x="0" y="57" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">BUILD</text>
    </g>
    <path d="M280,35 L310,35" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <polygon points="310,32 316,35 310,38" fill="#10b981" opacity="0.3"/>

    <g transform="translate(355, 0)">
      <rect x="-40" y="0" width="80" height="70" rx="12" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <circle cx="0" cy="26" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
      <path d="M-4,26 L-1,29 L5,23" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
      <text x="0" y="57" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">TEST</text>
    </g>
    <path d="M400,35 L430,35" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <polygon points="430,32 436,35 430,38" fill="#10b981" opacity="0.3"/>

    <g transform="translate(475, 0)">
      <rect x="-40" y="0" width="80" height="70" rx="12" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <path d="M-6,20 L0,30 L6,20" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
      <line x1="-8" y1="33" x2="8" y2="33" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
      <text x="0" y="57" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">DEPLOY</text>
    </g>
    <path d="M520,35 L550,35" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <polygon points="550,32 556,35 550,38" fill="#10b981" opacity="0.3"/>

    <g transform="translate(595, 0)">
      <rect x="-40" y="0" width="80" height="70" rx="12" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <circle cx="0" cy="25" r="9" fill="none" stroke="white" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="0" cy="25" r="3" fill="white" opacity="0.25"/>
      <text x="0" y="57" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">MONITOR</text>
    </g>
  </g>

  <!-- Git flow -->
  <g transform="translate(0, 410)">
    <line x1="100" y1="25" x2="700" y2="25" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
    <circle cx="160" cy="25" r="4" fill="#1a1a1e" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>
    <circle cx="280" cy="25" r="4" fill="#1a1a1e" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>
    <circle cx="400" cy="25" r="5" fill="#10b981" opacity="0.5"/>
    <circle cx="520" cy="25" r="4" fill="#1a1a1e" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>
    <circle cx="640" cy="25" r="6" fill="#1a1a1e" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <circle cx="640" cy="25" r="2.5" fill="#10b981" opacity="0.5"/>

    <text x="160" y="48" fill="white" opacity="0.2" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">commit</text>
    <text x="280" y="48" fill="white" opacity="0.2" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">merge</text>
    <text x="400" y="48" fill="white" opacity="0.2" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">release</text>
    <text x="520" y="48" fill="white" opacity="0.2" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">tag</text>
    <text x="640" y="48" fill="#10b981" opacity="0.45" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">LIVE</text>
  </g>

  <!-- Title -->
  <text x="400" y="520" fill="white" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="3">
    CI/CD PIPELINE
  </text>
  <text x="400" y="548" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" letter-spacing="1">
    Continuous Integration &amp; Deployment
  </text>
</svg>
