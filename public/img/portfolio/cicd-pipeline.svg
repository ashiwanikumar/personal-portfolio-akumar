<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Diagram: CI/CD pipeline stages commit, build, test, scan, deploy and monitor, with a feedback loop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#12151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.13"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#71717a"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <g transform="translate(0 60)">
  <rect x="30" y="206" width="104" height="128" rx="12" fill="#161a20" stroke="#2f5a4a" stroke-width="1"/>
  <circle cx="82.0" cy="240" r="11" fill="#10b981"/>
  <path d="M77.0 240 L80.5 244 L87.5 236" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82.0" y="284" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#e4e4e7" text-anchor="middle">commit</text>
  <text x="82.0" y="308" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="middle">git push</text>
  <line x1="135" y1="270" x2="148" y2="270" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="150" y="206" width="104" height="128" rx="12" fill="#161a20" stroke="#2f5a4a" stroke-width="1"/>
  <circle cx="202.0" cy="240" r="11" fill="#10b981"/>
  <path d="M197.0 240 L200.5 244 L207.5 236" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="202.0" y="284" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#e4e4e7" text-anchor="middle">build</text>
  <text x="202.0" y="308" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="middle">Docker</text>
  <line x1="255" y1="270" x2="268" y2="270" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="270" y="206" width="104" height="128" rx="12" fill="#161a20" stroke="#2f5a4a" stroke-width="1"/>
  <circle cx="322.0" cy="240" r="11" fill="#10b981"/>
  <path d="M317.0 240 L320.5 244 L327.5 236" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="322.0" y="284" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#e4e4e7" text-anchor="middle">test</text>
  <text x="322.0" y="308" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="middle">unit + e2e</text>
  <line x1="375" y1="270" x2="388" y2="270" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="390" y="206" width="104" height="128" rx="12" fill="#161a20" stroke="#2f5a4a" stroke-width="1"/>
  <circle cx="442.0" cy="240" r="11" fill="#10b981"/>
  <path d="M437.0 240 L440.5 244 L447.5 236" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="442.0" y="284" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#e4e4e7" text-anchor="middle">scan</text>
  <text x="442.0" y="308" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="middle">SonarQube</text>
  <line x1="495" y1="270" x2="508" y2="270" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="510" y="206" width="104" height="128" rx="12" fill="#1c2128" stroke="#34d399" stroke-width="2"/>
  <circle cx="562.0" cy="240" r="11" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="46 24"/>
  <text x="562.0" y="284" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#e4e4e7" text-anchor="middle">deploy</text>
  <text x="562.0" y="308" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="middle">Helm</text>
  <line x1="615" y1="270" x2="628" y2="270" stroke="#71717a" stroke-width="2" marker-end="url(#arrm)"/>
  <rect x="630" y="206" width="104" height="128" rx="12" fill="#161a20" stroke="#2a3038" stroke-width="1"/>
  <circle cx="682.0" cy="240" r="10" fill="none" stroke="#71717a" stroke-width="2"/>
  <text x="682.0" y="284" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#a1a1aa" text-anchor="middle">monitor</text>
  <text x="682.0" y="308" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="middle">Grafana</text>
  <path d="M682.0 336 L682.0 384 Q682.0 402 664.0 402 L100.0 402 Q82.0 402 82.0 384 L82.0 346" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arr)" stroke-opacity="0.7"/>
  <rect x="310" y="388" width="180" height="28" rx="14" fill="#12151a" stroke="#12151a" stroke-width="1"/>
  <text x="400" y="407" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#34d399" text-anchor="middle">feedback loop</text>
  <rect x="200" y="96" width="400" height="56" rx="12" fill="#161a20" stroke="#2a3038" stroke-width="1"/>
  <circle cx="230" cy="124" r="6" fill="#34d399"/>
  <text x="248" y="129" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#e4e4e7" text-anchor="start">pipeline #1482</text>
  <text x="580" y="129" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#34d399" text-anchor="end">deploying…</text>
  </g>
  <text x="400" y="540" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#34d399" text-anchor="middle" letter-spacing="0.5">Jenkins  ·  GitLab CI  ·  security gates on every build</text>
</svg>
