<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0f"/>
      <stop offset="100%" style="stop-color:#111115"/>
    </linearGradient>
    <linearGradient id="green4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41"/>
      <stop offset="100%" style="stop-color:#00cc88"/>
    </linearGradient>
    <filter id="sg4">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg4)"/>
  <pattern id="d4" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.8" fill="white" opacity="0.08"/>
  </pattern>
  <rect width="800" height="600" fill="url(#d4)"/>
  <circle cx="400" cy="280" r="180" fill="#00ff41" opacity="0.02" filter="url(#sg4)"/>

  <!-- Dashboard Window -->
  <g transform="translate(150, 70)">
    <!-- Window frame -->
    <rect x="0" y="0" width="500" height="380" rx="14" fill="#141416" stroke="white" stroke-opacity="0.08"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="500" height="36" rx="14" fill="#1a1a1e"/>
    <rect x="0" y="14" width="500" height="22" fill="#1a1a1e"/>
    <!-- Traffic lights -->
    <circle cx="20" cy="18" r="5" fill="#ff5f57" opacity="0.8"/>
    <circle cx="38" cy="18" r="5" fill="#febc2e" opacity="0.8"/>
    <circle cx="56" cy="18" r="5" fill="#28c840" opacity="0.8"/>
    <text x="250" y="22" fill="white" opacity="0.4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">SRE DASHBOARD</text>

    <!-- CPU Usage Chart -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="225" height="120" rx="10" fill="#111115" stroke="white" stroke-opacity="0.05"/>
      <text x="12" y="22" fill="white" opacity="0.35" font-family="system-ui, sans-serif" font-size="10" font-weight="600">CPU USAGE</text>
      <!-- Chart line -->
      <polyline points="20,90 50,75 80,80 110,55 140,60 170,45 200,50"
                fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.6"/>
      <!-- Area fill -->
      <polygon points="20,90 50,75 80,80 110,55 140,60 170,45 200,50 200,100 20,100"
               fill="#00ff41" opacity="0.05"/>
      <!-- Grid lines -->
      <line x1="20" y1="100" x2="210" y2="100" stroke="white" stroke-opacity="0.05"/>
      <line x1="20" y1="75" x2="210" y2="75" stroke="white" stroke-opacity="0.03"/>
      <line x1="20" y1="50" x2="210" y2="50" stroke="white" stroke-opacity="0.03"/>
    </g>

    <!-- Uptime Ring -->
    <g transform="translate(375, 110)">
      <rect x="-110" y="-50" width="220" height="120" rx="10" fill="#111115" stroke="white" stroke-opacity="0.05"/>
      <circle cx="0" cy="10" r="40" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="6"/>
      <circle cx="0" cy="10" r="40" fill="none" stroke="#00ff41" stroke-width="6" opacity="0.6"
              stroke-dasharray="248 252" stroke-dashoffset="0" stroke-linecap="round"
              transform="rotate(-90, 0, 10)"/>
      <text x="0" y="10" fill="white" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" font-weight="700" dominant-baseline="middle">99.9%</text>
      <text x="0" y="28" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">UPTIME</text>
    </g>

    <!-- Alerts -->
    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="225" height="70" rx="10" fill="#111115" stroke="white" stroke-opacity="0.05"/>
      <text x="12" y="22" fill="white" opacity="0.35" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ALERTS</text>
      <circle cx="20" cy="42" r="4" fill="#28c840" opacity="0.7"/>
      <text x="30" y="46" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="9">P1: 0 Active</text>
      <circle cx="120" cy="42" r="4" fill="#28c840" opacity="0.7"/>
      <text x="130" y="46" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="9">P3: 0 Info</text>
      <circle cx="20" cy="58" r="4" fill="#febc2e" opacity="0.7"/>
      <text x="30" y="62" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="9">P2: 2 Warning</text>
    </g>

    <!-- SLO Status -->
    <g transform="translate(255, 185)">
      <rect x="0" y="0" width="225" height="70" rx="10" fill="#111115" stroke="white" stroke-opacity="0.05"/>
      <text x="12" y="22" fill="white" opacity="0.35" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SLO STATUS</text>
      <text x="12" y="42" fill="white" opacity="0.25" font-family="system-ui, sans-serif" font-size="9">Latency p99</text>
      <rect x="85" y="36" width="120" height="6" rx="3" fill="white" opacity="0.06"/>
      <rect x="85" y="36" width="110" height="6" rx="3" fill="#00ff41" opacity="0.4"/>
      <text x="12" y="60" fill="white" opacity="0.25" font-family="system-ui, sans-serif" font-size="9">Error Rate</text>
      <rect x="85" y="54" width="120" height="6" rx="3" fill="white" opacity="0.06"/>
      <rect x="85" y="54" width="115" height="6" rx="3" fill="#00ff41" opacity="0.4"/>
    </g>

    <!-- Live Logs -->
    <g transform="translate(20, 270)">
      <rect x="0" y="0" width="460" height="80" rx="10" fill="#0d0d0f" stroke="white" stroke-opacity="0.05"/>
      <text x="12" y="18" fill="white" opacity="0.35" font-family="system-ui, sans-serif" font-size="10" font-weight="600">LIVE LOGS</text>
      <text x="12" y="36" fill="#00ff41" opacity="0.3" font-family="monospace" font-size="8">[INFO] Service health check passed</text>
      <text x="12" y="50" fill="#00aaff" opacity="0.3" font-family="monospace" font-size="8">[INFO] Request processed in 45ms</text>
      <text x="12" y="64" fill="#febc2e" opacity="0.3" font-family="monospace" font-size="8">[WARN] Cache hit ratio: 94.5%</text>
    </g>
  </g>

  <!-- Tool icons at bottom -->
  <g transform="translate(0, 480)">
    <!-- Prometheus -->
    <g transform="translate(260, 0)">
      <circle cx="0" cy="0" r="18" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <circle cx="0" cy="-2" r="6" fill="none" stroke="#E6522C" stroke-width="1.5" opacity="0.5"/>
      <line x1="0" y1="4" x2="0" y2="10" stroke="#E6522C" stroke-width="1.5" opacity="0.4"/>
      <text x="0" y="32" fill="white" opacity="0.25" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Prometheus</text>
    </g>

    <!-- Grafana -->
    <g transform="translate(400, 0)">
      <circle cx="0" cy="0" r="18" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <polyline points="-8,4 -3,-4 2,2 7,-6" fill="none" stroke="#F46800" stroke-width="1.5" opacity="0.5"/>
      <text x="0" y="32" fill="white" opacity="0.25" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Grafana</text>
    </g>

    <!-- PagerDuty -->
    <g transform="translate(540, 0)">
      <circle cx="0" cy="0" r="18" fill="#141416" stroke="white" stroke-opacity="0.07"/>
      <rect x="-5" y="-7" width="10" height="14" rx="2" fill="none" stroke="#06AC38" stroke-width="1.5" opacity="0.5"/>
      <line x1="-3" y1="-2" x2="3" y2="-2" stroke="#06AC38" stroke-width="1" opacity="0.4"/>
      <line x1="-3" y1="2" x2="3" y2="2" stroke="#06AC38" stroke-width="1" opacity="0.4"/>
      <text x="0" y="32" fill="white" opacity="0.25" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">PagerDuty</text>
    </g>
  </g>

  <!-- Title -->
  <text x="400" y="555" fill="white" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="3">
    SRE IMPLEMENTATION
  </text>
</svg>
