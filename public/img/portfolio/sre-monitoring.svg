<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001100"/>
      <stop offset="100%" style="stop-color:#002200"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad4)"/>

  <!-- Grid pattern -->
  <g stroke="#00ff41" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- Main dashboard frame -->
  <g filter="url(#glow4)">
    <rect x="100" y="80" width="600" height="380" rx="15" fill="none" stroke="#00ff41" stroke-width="2"/>

    <!-- Dashboard header -->
    <rect x="100" y="80" width="600" height="40" rx="15" fill="#00ff41" fill-opacity="0.1"/>
    <circle cx="130" cy="100" r="8" fill="#ff4444"/>
    <circle cx="155" cy="100" r="8" fill="#ffaa00"/>
    <circle cx="180" cy="100" r="8" fill="#00ff41"/>
    <text x="400" y="106" fill="#00ff41" font-family="monospace" font-size="14" text-anchor="middle">SRE DASHBOARD</text>
  </g>

  <!-- Metrics graph -->
  <g transform="translate(130, 140)" filter="url(#glow4)">
    <rect x="0" y="0" width="250" height="120" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.5"/>
    <text x="125" y="15" fill="#00cc33" font-family="monospace" font-size="10" text-anchor="middle">CPU USAGE</text>

    <!-- Graph line -->
    <polyline points="10,100 30,90 50,70 70,75 90,50 110,55 130,40 150,60 170,45 190,30 210,50 230,35"
              fill="none" stroke="#00ff41" stroke-width="2"/>

    <!-- Graph dots -->
    <g fill="#00ff41">
      <circle cx="10" cy="100" r="3"/>
      <circle cx="50" cy="70" r="3"/>
      <circle cx="90" cy="50" r="3"/>
      <circle cx="130" cy="40" r="3"/>
      <circle cx="170" cy="45" r="3"/>
      <circle cx="210" cy="50" r="3"/>
    </g>

    <!-- Axis -->
    <line x1="10" y1="105" x2="240" y2="105" stroke="#00ff41" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Uptime gauge -->
  <g transform="translate(530, 200)" filter="url(#glow4)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#00ff41" stroke-width="3" stroke-opacity="0.2"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#00ff41" stroke-width="4"
            stroke-dasharray="330 345" transform="rotate(-90)"/>
    <text x="0" y="5" fill="#00ff41" font-family="monospace" font-size="20" text-anchor="middle" font-weight="bold">99.9%</text>
    <text x="0" y="20" fill="#00cc33" font-family="monospace" font-size="10" text-anchor="middle">UPTIME</text>
  </g>

  <!-- Alert indicators -->
  <g transform="translate(130, 280)" filter="url(#glow4)">
    <rect x="0" y="0" width="250" height="80" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.5"/>
    <text x="125" y="15" fill="#00cc33" font-family="monospace" font-size="10" text-anchor="middle">ALERTS</text>

    <!-- Alert items -->
    <g transform="translate(10, 30)">
      <circle cx="8" cy="8" r="6" fill="#00ff41"/>
      <text x="20" y="12" fill="#00ff41" font-family="monospace" font-size="10">P1: 0 Active</text>
    </g>
    <g transform="translate(10, 50)">
      <circle cx="8" cy="8" r="6" fill="#ffaa00"/>
      <text x="20" y="12" fill="#ffaa00" font-family="monospace" font-size="10">P2: 2 Warning</text>
    </g>
    <g transform="translate(130, 30)">
      <circle cx="8" cy="8" r="6" fill="#00ff41"/>
      <text x="20" y="12" fill="#00ff41" font-family="monospace" font-size="10">P3: 0 Info</text>
    </g>
  </g>

  <!-- SLO status -->
  <g transform="translate(420, 280)" filter="url(#glow4)">
    <rect x="0" y="0" width="250" height="80" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.5"/>
    <text x="125" y="15" fill="#00cc33" font-family="monospace" font-size="10" text-anchor="middle">SLO STATUS</text>

    <!-- Progress bars -->
    <g transform="translate(10, 28)">
      <text x="0" y="10" fill="#00ff41" font-family="monospace" font-size="9">Latency p99</text>
      <rect x="80" y="2" width="150" height="10" fill="#002200" stroke="#00ff41" stroke-width="1"/>
      <rect x="80" y="2" width="140" height="10" fill="#00ff41" fill-opacity="0.5"/>
    </g>
    <g transform="translate(10, 50)">
      <text x="0" y="10" fill="#00ff41" font-family="monospace" font-size="9">Error Rate</text>
      <rect x="80" y="2" width="150" height="10" fill="#002200" stroke="#00ff41" stroke-width="1"/>
      <rect x="80" y="2" width="145" height="10" fill="#00ff41" fill-opacity="0.5"/>
    </g>
  </g>

  <!-- Log stream -->
  <g transform="translate(130, 380)" filter="url(#glow4)">
    <rect x="0" y="0" width="540" height="60" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.5"/>
    <text x="270" y="12" fill="#00cc33" font-family="monospace" font-size="10" text-anchor="middle">LIVE LOGS</text>

    <text x="10" y="28" fill="#00ff41" font-family="monospace" font-size="9">[INFO] 2024-01-15 10:23:45 - Service health check passed</text>
    <text x="10" y="40" fill="#00ff41" font-family="monospace" font-size="9">[INFO] 2024-01-15 10:23:44 - Request processed in 45ms</text>
    <text x="10" y="52" fill="#00cc33" font-family="monospace" font-size="9">[DEBUG] 2024-01-15 10:23:43 - Cache hit ratio: 94.5%</text>
  </g>

  <!-- Prometheus/Grafana icons -->
  <g transform="translate(200, 500)" filter="url(#glow4)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#00ff41" stroke-width="2"/>
    <path d="M-8,-8 L8,-8 L8,8 L-8,8 Z M0,-12 L0,12 M-12,0 L12,0" stroke="#00ff41" stroke-width="1.5" fill="none"/>
    <text x="0" y="35" fill="#00cc33" font-family="monospace" font-size="10" text-anchor="middle">Prometheus</text>
  </g>

  <g transform="translate(400, 500)" filter="url(#glow4)">
    <rect x="-20" y="-15" width="40" height="30" rx="3" fill="none" stroke="#00ff41" stroke-width="2"/>
    <line x1="-15" y1="5" x2="-5" y2="-8" stroke="#00ff41" stroke-width="2"/>
    <line x1="-5" y1="-8" x2="5" y2="5" stroke="#00ff41" stroke-width="2"/>
    <line x1="5" y1="5" x2="15" y2="-5" stroke="#00ff41" stroke-width="2"/>
    <text x="0" y="35" fill="#00cc33" font-family="monospace" font-size="10" text-anchor="middle">Grafana</text>
  </g>

  <g transform="translate(600, 500)" filter="url(#glow4)">
    <rect x="-20" y="-15" width="40" height="30" rx="3" fill="none" stroke="#00ff41" stroke-width="2"/>
    <circle cx="-8" cy="-3" r="5" fill="none" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="-5" y1="0" x2="15" y2="0" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="5" y1="-8" x2="5" y2="8" stroke="#00ff41" stroke-width="1.5"/>
    <text x="0" y="35" fill="#00cc33" font-family="monospace" font-size="10" text-anchor="middle">PagerDuty</text>
  </g>

  <!-- Title -->
  <text x="400" y="560" fill="#00ff41" font-family="monospace" font-size="24" text-anchor="middle" filter="url(#glow4)">
    SRE IMPLEMENTATION
  </text>

  <!-- Decorative corners -->
  <g stroke="#00ff41" stroke-width="2" fill="none">
    <path d="M20,50 L20,20 L50,20"/>
    <path d="M750,20 L780,20 L780,50"/>
    <path d="M780,550 L780,580 L750,580"/>
    <path d="M50,580 L20,580 L20,550"/>
  </g>
</svg>
