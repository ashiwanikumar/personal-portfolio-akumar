<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Diagram: three-tier web application with a Next.js frontend, Node.js API and MongoDB/PostgreSQL data layer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#12151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.13"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#71717a"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <g transform="translate(0 14)">
  <rect x="150" y="80" width="500" height="104" rx="14" fill="#161a20" stroke="#2a3038" stroke-width="1"/>
  <rect x="150" y="80" width="6" height="104" rx="3" fill="#34d399"/>
  <text x="184" y="124" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#e4e4e7" text-anchor="start">frontend</text>
  <text x="184" y="156" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#a1a1aa" text-anchor="start">Next.js  ·  React  ·  Tailwind</text>
  <rect x="530" y="115" width="96" height="32" rx="16.0" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1"/>
  <rect x="530" y="115" width="96" height="32" rx="16.0" fill="none" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="578.0" y="135.68" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">browser</text>
  <line x1="400" y1="188" x2="400" y2="222" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="222" x2="420" y2="190" stroke="#71717a" stroke-width="2" marker-end="url(#arrm)"/>
  <rect x="150" y="230" width="500" height="104" rx="14" fill="#161a20" stroke="#2a3038" stroke-width="1"/>
  <rect x="150" y="230" width="6" height="104" rx="3" fill="#38bdf8"/>
  <text x="184" y="274" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#e4e4e7" text-anchor="start">api</text>
  <text x="184" y="306" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#a1a1aa" text-anchor="start">Node.js  ·  Express  ·  REST</text>
  <rect x="530" y="265" width="96" height="32" rx="16.0" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1"/>
  <rect x="530" y="265" width="96" height="32" rx="16.0" fill="none" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="578.0" y="285.68" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">server</text>
  <line x1="400" y1="338" x2="400" y2="372" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="372" x2="420" y2="340" stroke="#71717a" stroke-width="2" marker-end="url(#arrm)"/>
  <rect x="150" y="380" width="500" height="104" rx="14" fill="#161a20" stroke="#2a3038" stroke-width="1"/>
  <rect x="150" y="380" width="6" height="104" rx="3" fill="#f59e0b"/>
  <text x="184" y="424" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#e4e4e7" text-anchor="start">data</text>
  <text x="184" y="456" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#a1a1aa" text-anchor="start">MongoDB  ·  PostgreSQL</text>
  <rect x="530" y="415" width="96" height="32" rx="16.0" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1"/>
  <rect x="530" y="415" width="96" height="32" rx="16.0" fill="none" stroke="#f59e0b" stroke-opacity="0.45"/>
  <text x="578.0" y="435.68" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle">storage</text>
  <text x="380" y="214" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" fill="#34d399" text-anchor="end">request</text>
  <text x="440" y="214" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" fill="#71717a" text-anchor="start">json</text>
  <text x="380" y="364" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" fill="#34d399" text-anchor="end">query</text>
  <text x="440" y="364" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" fill="#71717a" text-anchor="start">rows</text>
  </g>
  <text x="400" y="540" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#34d399" text-anchor="middle" letter-spacing="0.5">Dockerised  ·  CI-deployed  ·  REST APIs</text>
</svg>
