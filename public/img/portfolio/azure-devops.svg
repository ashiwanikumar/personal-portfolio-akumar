<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgAz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0f"/>
      <stop offset="100%" style="stop-color:#111115"/>
    </linearGradient>
    <linearGradient id="accAz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="sgAz">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgAz)"/>
  <pattern id="dAz" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.8" fill="white" opacity="0.08"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dAz)"/>
  <ellipse cx="400" cy="200" rx="260" ry="110" fill="#38bdf8" opacity="0.03" filter="url(#sgAz)"/>

  <!-- Azure chevron mark -->
  <g transform="translate(400, 150)">
    <path d="M-38,32 L-6,-32 L8,-32 L-16,32 Z" fill="#38bdf8" opacity="0.5"/>
    <path d="M12,-24 L38,32 L22,32 L14,12 L-2,32 L-14,32 Z" fill="url(#accAz)" opacity="0.6"/>
    <circle r="58" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
    <circle r="72" fill="none" stroke="#10b981" stroke-width="1" opacity="0.12"/>
  </g>

  <!-- Service tiles: Boards, Repos, Pipelines, Artifacts -->
  <g font-family="system-ui, sans-serif">
    <g transform="translate(130, 280)">
      <rect width="120" height="72" rx="10" fill="#1a1a1e" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
      <rect x="18" y="18" width="10" height="26" rx="2" fill="#38bdf8" opacity="0.5"/>
      <rect x="34" y="18" width="10" height="18" rx="2" fill="#38bdf8" opacity="0.35"/>
      <rect x="50" y="18" width="10" height="32" rx="2" fill="#38bdf8" opacity="0.25"/>
      <text x="60" y="60" fill="white" opacity="0.35" font-size="11" text-anchor="middle">Boards</text>
    </g>
    <g transform="translate(270, 280)">
      <rect width="120" height="72" rx="10" fill="#1a1a1e" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
      <circle cx="40" cy="26" r="5" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
      <circle cx="80" cy="26" r="5" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
      <path d="M45,26 L75,26" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
      <text x="60" y="60" fill="white" opacity="0.35" font-size="11" text-anchor="middle">Repos</text>
    </g>
    <g transform="translate(410, 280)">
      <rect width="120" height="72" rx="10" fill="#1a1a1e" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
      <path d="M25,30 L45,30 L55,20 L75,20" stroke="url(#accAz)" stroke-width="2" fill="none" opacity="0.7"/>
      <circle cx="88" cy="20" r="5" fill="#10b981" opacity="0.6"/>
      <text x="60" y="60" fill="#34d399" opacity="0.55" font-size="11" text-anchor="middle">Pipelines</text>
    </g>
    <g transform="translate(550, 280)">
      <rect width="120" height="72" rx="10" fill="#1a1a1e" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
      <rect x="42" y="16" width="36" height="12" rx="3" fill="#38bdf8" opacity="0.3"/>
      <rect x="42" y="32" width="36" height="12" rx="3" fill="#38bdf8" opacity="0.2"/>
      <text x="60" y="60" fill="white" opacity="0.35" font-size="11" text-anchor="middle">Artifacts</text>
    </g>
  </g>

  <!-- Flow line -->
  <g opacity="0.35">
    <path d="M250,316 L270,316" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M390,316 L410,316" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M530,316 L550,316" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Release track -->
  <g transform="translate(0, 410)" font-family="system-ui, sans-serif">
    <path d="M140,25 L660,25" stroke="white" stroke-opacity="0.1" stroke-width="1.5"/>
    <circle cx="180" cy="25" r="4" fill="#38bdf8" opacity="0.5"/>
    <circle cx="320" cy="25" r="4" fill="#38bdf8" opacity="0.5"/>
    <circle cx="460" cy="25" r="4" fill="#1a1a1e" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>
    <circle cx="620" cy="25" r="6" fill="#1a1a1e" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <circle cx="620" cy="25" r="2.5" fill="#10b981" opacity="0.5"/>
    <text x="180" y="48" fill="white" opacity="0.2" font-size="10" text-anchor="middle">build</text>
    <text x="320" y="48" fill="white" opacity="0.2" font-size="10" text-anchor="middle">test</text>
    <text x="460" y="48" fill="white" opacity="0.2" font-size="10" text-anchor="middle">stage</text>
    <text x="620" y="48" fill="#10b981" opacity="0.45" font-size="10" text-anchor="middle" font-weight="600">PROD</text>
  </g>

  <!-- Title -->
  <text x="400" y="520" fill="white" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="3">
    AZURE DEVOPS
  </text>
  <text x="400" y="548" fill="white" opacity="0.3" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" letter-spacing="1">
    Boards, Repos, Pipelines &amp; Releases
  </text>
</svg>
