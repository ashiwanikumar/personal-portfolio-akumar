<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Diagram: Azure DevOps Boards, Repos, Pipelines and Artifacts feeding a release to dev, staging and an approval-gated prod">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#12151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.13"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#71717a"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <g transform="translate(0 30)">
  <rect x="40" y="110" width="164" height="96" rx="12" fill="#161a20" stroke="#2a3038" stroke-width="1"/>
  <text x="122" y="152" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#e4e4e7" text-anchor="middle">Boards</text>
  <text x="122" y="180" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="middle">work items</text>
  <line x1="206" y1="158" x2="224" y2="158" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="226" y="110" width="164" height="96" rx="12" fill="#161a20" stroke="#2a3038" stroke-width="1"/>
  <text x="308" y="152" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#e4e4e7" text-anchor="middle">Repos</text>
  <text x="308" y="180" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="middle">PR + policy</text>
  <line x1="392" y1="158" x2="410" y2="158" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="412" y="110" width="164" height="96" rx="12" fill="#1c2128" stroke="#34d399" stroke-width="2"/>
  <text x="494" y="152" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#e4e4e7" text-anchor="middle">Pipelines</text>
  <text x="494" y="180" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="middle">YAML CI/CD</text>
  <line x1="578" y1="158" x2="596" y2="158" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="598" y="110" width="164" height="96" rx="12" fill="#161a20" stroke="#2a3038" stroke-width="1"/>
  <text x="680" y="152" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#e4e4e7" text-anchor="middle">Artifacts</text>
  <text x="680" y="180" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="middle">feeds</text>
  <text x="40" y="88" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#3b9eea" text-anchor="start" letter-spacing="2">AZURE DEVOPS</text>
  <path d="M490 210 L490 262" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="40" y="300" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#71717a" text-anchor="start" letter-spacing="2">RELEASE</text>
  <rect x="40" y="318" width="220" height="130" rx="14" fill="#161a20" stroke="#2f5a4a" stroke-width="1.5"/>
  <circle cx="74" cy="352" r="11" fill="#10b981"/>
  <path d="M69 352 L72.5 356 L79.5 348" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="358" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e4e4e7" text-anchor="start">dev</text>
  <text x="62" y="398" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="start">gate</text>
  <text x="62" y="422" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#34d399" text-anchor="start">auto</text>
  <line x1="262" y1="383" x2="288" y2="383" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="290" y="318" width="220" height="130" rx="14" fill="#161a20" stroke="#2f5a4a" stroke-width="1.5"/>
  <circle cx="324" cy="352" r="11" fill="#10b981"/>
  <path d="M319 352 L322.5 356 L329.5 348" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="346" y="358" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e4e4e7" text-anchor="start">staging</text>
  <text x="312" y="398" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="start">gate</text>
  <text x="312" y="422" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#34d399" text-anchor="start">auto</text>
  <line x1="512" y1="383" x2="538" y2="383" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="540" y="318" width="220" height="130" rx="14" fill="#161a20" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="574" cy="352" r="11" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="574" cy="352" r="3.5" fill="#f59e0b"/>
  <text x="596" y="358" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e4e4e7" text-anchor="start">prod</text>
  <text x="562" y="398" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#71717a" text-anchor="start">gate</text>
  <text x="562" y="422" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="start">approval</text>
  </g>
  <text x="400" y="540" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#34d399" text-anchor="middle" letter-spacing="0.5">Boards → Repos → Pipelines  ·  gated promotion to prod</text>
</svg>
